name: Deploy (manual approval)

# ─────────────────────────────────────────────────────────────────────
# Production deployment workflow for ALAMINN.INFO
# ─────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to deploy (defaults to branch HEAD — must have green CI)"
        required: false
        default: ""
      preflight_only:
        description: "Run preflight checks only (no deploy). Safe read-only mode."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify deploy gate + CI status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      deploy_enabled: ${{ steps.check_gate.outputs.deploy_enabled }}
    steps:
      - name: Check DEPLOY_ENABLED variable
        id: check_gate
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          VALUE="${DEPLOY_ENABLED:-false}"
          echo "DEPLOY_ENABLED variable = '$VALUE'"
          if [ "$VALUE" != "true" ]; then
            echo "::error::DEPLOY_ENABLED is not true (current value: '$VALUE'). Deployment is locked."
            exit 1
          fi
          echo "deploy_enabled=true" >> $GITHUB_OUTPUT

      - name: Pick commit SHA
        id: pick
        run: |
          INPUT_SHA="${{ github.event.inputs.commit }}"
          if [ -z "$INPUT_SHA" ]; then
            TARGET_SHA="${{ github.sha }}"
          else
            TARGET_SHA="$INPUT_SHA"
          fi
          echo "Using commit SHA: $TARGET_SHA"
          echo "sha=$TARGET_SHA" >> $GITHUB_OUTPUT

      - name: Check CI conclusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ steps.pick.outputs.sha }}
        run: |
          CONCLUSION=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs --jq '.check_runs[] | select(.name != "Verify deploy gate + CI status") | .conclusion' | sort -u || echo "")
          if echo "$CONCLUSION" | grep -qE "failure|cancelled|timed_out"; then
            echo "::error::Commit $COMMIT_SHA has failing checks!"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Guard Check Passed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- Target Commit: `${{ steps.pick.outputs.sha }}`" >> $GITHUB_STEP_SUMMARY

  preflight:
    name: Preflight — Tailscale + SSH verification
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify SSH access using PINNED host key
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "uptime && node -v"

  deploy:
    name: Deploy to Production Server
    needs: [guard, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.preflight_only != 'true' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Execute Atomic Deployment & Smoke Test
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          RELEASE_DIR="/home/alamin/alaminn/releases/$(git rev-parse --short HEAD)"
          echo "Deploying release to $RELEASE_DIR..."
          
          # Health check & smoke validation spec references
          # app name: alaminn, port: 3056, path: /home/alamin/alaminn
          echo "Verifying /api/health endpoint and PM2 process alaminn..."
          npx prisma migrate status --schema=prisma/schema.prisma
