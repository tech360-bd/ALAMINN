name: Deploy (manual approval)

# ─────────────────────────────────────────────────────────────────────
# Production deployment workflow for ALAMINN.INFO
# ─────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to deploy (defaults to branch HEAD — must have green CI)"
        required: false
        default: ""
      preflight_only:
        description: "Run preflight checks only (no deploy). Safe read-only mode."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify deploy gate + CI status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      deploy_enabled: ${{ steps.check_gate.outputs.deploy_enabled }}
    steps:
      - name: Check DEPLOY_ENABLED variable
        id: check_gate
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          VALUE="${DEPLOY_ENABLED:-false}"
          echo "DEPLOY_ENABLED variable = '$VALUE'"
          if [ "$VALUE" = "true" ]; then
            echo "deploy_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Pick commit SHA
        id: pick
        run: |
          INPUT_SHA="${{ github.event.inputs.commit }}"
          if [ -z "$INPUT_SHA" ]; then
            TARGET_SHA="${{ github.sha }}"
          else
            TARGET_SHA="$INPUT_SHA"
          echo "Using commit SHA: $TARGET_SHA"
          echo "sha=$TARGET_SHA" >> $GITHUB_OUTPUT

      - name: Check CI conclusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ steps.pick.outputs.sha }}
        run: |
          echo "Verifying check runs for commit $COMMIT_SHA..."
          CONCLUSION=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs --jq '.check_runs[] | select(.name != "Verify deploy gate + CI status") | .conclusion' | sort -u || echo "")
          echo "Found check conclusions: $CONCLUSION"
          if echo "$CONCLUSION" | grep -qE "failure|cancelled|timed_out"; then
            echo "::error::Commit $COMMIT_SHA has failing checks!"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### Guard Check Passed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- Target Commit: `${{ steps.pick.outputs.sha }}`" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy Enabled: `${{ steps.check_gate.outputs.deploy_enabled }}`" >> $GITHUB_STEP_SUMMARY

  preflight:
    name: Preflight — Tailscale + SSH verification
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then echo "::error::Missing TS_OAUTH_CLIENT_ID"; MISSING=1; fi
          if [ -z "${{ secrets.TS_OAUTH_SECRET }}" ]; then echo "::error::Missing TS_OAUTH_SECRET"; MISSING=1; fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then echo "::error::Missing SERVER_SSH_KEY"; MISSING=1; fi
          if [ "$MISSING" -eq 1 ]; then exit 1; fi

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Verify SSH access using PINNED host key
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_IP: 100.94.234.101
          SERVER_USER: alamin
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_IP" "uptime && node -v"
