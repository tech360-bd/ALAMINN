name: CI

on:
  push:
    branches: ["main", "feature/ci-cd-pipeline"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck · Lint · Test · Security · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      DATABASE_URL: file:${{ github.workspace }}/db/custom.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_BOOTSTRAP_EMAIL: ci-admin@alaminn.info
      ADMIN_BOOTSTRAP_PASSWORD: ci-only-throwaway-pass-9f3b
      EMAIL_FROM: noreply@localhost
      EMAIL_REPLY_TO: hello@localhost
      LOG_LEVEL: warn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.22.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Generate per-run secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Create ephemeral database + seed
        run: |
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Start dev server for API tests
        run: |
          npm run dev > /tmp/dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Dev server ready (attempt $i)"; exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start"; tail -50 /tmp/dev-server.log; exit 1

      - name: Unit + integration tests
        run: npm run test

      - name: Security suite (22 tests)
        env:
          SECURITY_TEST_BASE: http://localhost:3000
        run: |
          set +e
          npm run security:test 2>&1 | tee /tmp/security-output.txt
          code=${PIPESTATUS[0]}
          grep -E "^\[[0-9]+\] FAIL" /tmp/security-output.txt | head -25 | sed 's/^/::error::/' || true
          grep -A2 "Failed" /tmp/security-output.txt | head -10 | sed 's/^/::error::detail| /' || true
          exit $code

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            docs/security-report.md
            /tmp/dev-server.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: pkill -f "next dev" || true

      - name: Production build
        env:
          NODE_ENV: production
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build-output.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -B3 -A8 "Error\|error" /tmp/build-output.txt | tail -40 | sed 's/^/::error::build| /' || true
          fi
          exit $code

      - name: Standalone artifact smoke test
        run: |
          PORT=3100 NODE_ENV=production node .next/standalone/server.js > /tmp/standalone.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          echo "--- route checks ---"
          for p in / /api/health /higher-study /english-learning /work-with-me; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3100$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || { echo "FAILED on $p"; kill $SRV; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/v1/admin/dashboard)
          echo "/api/v1/admin/dashboard (anonymous) -> $code"
          [ "$code" = "401" ] || { echo "Admin API must reject anonymous access with 401"; kill $SRV; exit 1; }
          kill $SRV
          echo "Standalone smoke test PASSED"

      - name: Build summary
        run: echo "All CI gates passed — typecheck, lint, tests, security, build + standalone smoke." >> "$GITHUB_STEP_SUMMARY"
