name: CI

on:
  push:
    branches: ["main", "feature/ci-cd-pipeline"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck · Lint · Test · Security · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      TEST_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_BOOTSTRAP_EMAIL: ci-admin@alaminn.info
      ADMIN_BOOTSTRAP_PASSWORD: ci-only-throwaway-pass-9f3b
      EMAIL_FROM: noreply@localhost
      EMAIL_REPLY_TO: hello@localhost
      LOG_LEVEL: warn
      STAFF_BOOTSTRAP_EMAIL: ci-staff@example.invalid
      STAFF_BOOTSTRAP_NAME: CI Staff Administrator
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '25253'
      SMTP_USER: integration
      SMTP_PASS: local-SMTP-fixture-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup project Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Generate per-run secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "STAFF_BOOTSTRAP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ALAMINN_TEST_INSTANCE=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          DB_DIR=$(mktemp -d /tmp/alaminn-test-XXXXXX)
          touch "$DB_DIR/.disposable-alaminn-test"
          echo "DATABASE_URL=file:$DB_DIR/test.sqlite" >> "$GITHUB_ENV"

      - name: Validate schemas and replay SQLite migrations
        run: |
          npm run db:validate
          npm run db:validate -- mysql
          npm run db:migrate:deploy
          npm run db:migrate:status
          drift=0
          npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code || drift=$?
          if [ "$drift" -ne 0 ]; then
            echo "::error::SQLite Prisma schema drift detected (exit code $drift)."
            exit "$drift"
          fi
          python3 tests/migrations/sqlite_replay.py
          npm run db:verify
          node tests/migrations/client-parity.mjs sqlite
          node tests/migrations/sqlite-recovery.mjs
          npm run db:seed
          npm run staff:bootstrap

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Start dev server for API tests
        run: |
          node node_modules/next/dist/bin/next dev -p 3000 --hostname 0.0.0.0 > /tmp/dev-server.log 2>&1 &
          echo "$!" > /tmp/alaminn-next.pid
          for i in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/alaminn-next.pid)" 2>/dev/null; then break; fi
            if node --input-type=module -e 'import {verifyDisposableTarget} from "./tests/fixtures/disposable-target.mjs"; await verifyDisposableTarget(process.env.TEST_BASE_URL)' > /dev/null 2>&1; then
              echo "Dev server ready (attempt $i)"; exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start"; tail -50 /tmp/dev-server.log; exit 1

      - name: Unit + integration tests
        run: npm run test

      - name: Security suite (22 tests)
        env:
          SECURITY_TEST_BASE: http://localhost:3000
        run: npm run security:test

      - name: Stop dev server
        if: always()
        run: |
          if [ -s /tmp/alaminn-next.pid ]; then
            PID=$(cat /tmp/alaminn-next.pid)
            if kill -0 "$PID" 2>/dev/null; then kill "$PID"; fi
          fi

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Standalone artifact smoke test
        run: |
          PORT=3100 HOSTNAME=0.0.0.0 NODE_ENV=production node .next/standalone/server.js > /tmp/standalone.log 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if ! kill -0 "$SRV" 2>/dev/null; then break; fi
            if curl -fsS --max-time 2 http://127.0.0.1:3100/api/health/ready >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then
            echo '::error::Standalone application never became ready.'
            exit 1
          fi
          for p in / /api/health/ready /higher-study /english-learning /work-with-me; do
            code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || { echo "::error::Unexpected status for $p"; exit 1; }
          done
          code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/v1/admin/dashboard)
          [ "$code" = "401" ] || { echo "::error::Anonymous admin route returned $code instead of 401."; exit 1; }
          node --input-type=module -e '
            const res = await fetch("http://127.0.0.1:3100/api/health/ready", {
              method: "POST", headers: { authorization: "Bearer " + process.env.CRON_SECRET },
              redirect: "error", signal: AbortSignal.timeout(15000),
            });
            if (res.status !== 200) throw new Error(`Write probe returned HTTP ${res.status}`);'
          echo "Standalone smoke test PASSED"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            /tmp/alaminn-security-*/report.md
            /tmp/dev-server.log
            /tmp/standalone.log
          if-no-files-found: ignore

      - name: Build summary
        run: echo "All CI gates passed — typecheck, lint, tests, security, build + standalone smoke." >> "$GITHUB_STEP_SUMMARY"

  mariadb-history:
    name: MariaDB migration and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-mariadb-disposable
          MARIADB_DATABASE: alaminn_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DATABASE_URL: mysql://root:ci-mariadb-disposable@127.0.0.1:3306/alaminn_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Establish historical MariaDB state and persist an upgrade sentinel
        run: |
          set -euo pipefail
          HISTORY=$(mktemp -d)
          cp prisma/schema.mysql.prisma "$HISTORY/schema.prisma"
          mkdir "$HISTORY/migrations"
          cp prisma/migrations/mysql/migration_lock.toml "$HISTORY/migrations/"
          cp -r prisma/migrations/mysql/00000000000000_initial prisma/migrations/mysql/2026110* prisma/migrations/mysql/20261111120000_uci_staff_messaging_uc "$HISTORY/migrations/"
          cat > "$HISTORY/prisma.config.mjs" <<'EOF'
          export default { schema: './schema.prisma', migrations: { path: './migrations' }, datasource: { url: process.env.DATABASE_URL } };
          EOF
          npm run db:migrate:deploy -- --config "$HISTORY/prisma.config.mjs"
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -pci-mariadb-disposable alaminn_ci -e "INSERT INTO StaffAccount (id, email, passwordHash, name, updatedAt) VALUES ('ci-upgrade-keeper', 'ci-upgrade@example.invalid', 'disabled', 'Upgrade sentinel', CURRENT_TIMESTAMP)"
          rm -r "$HISTORY"
      - run: npm run db:migrate:deploy -- --config prisma.config.mysql.ts
      - run: npm run db:migrate:status -- --config prisma.config.mysql.ts
      - name: Enforce MariaDB schema parity (fail on drift)
        run: |
          drift=0
          npx --no-install prisma migrate diff --config prisma.config.mysql.ts --from-config-datasource --to-schema prisma/schema.mysql.prisma --exit-code || drift=$?
          if [ "$drift" -ne 0 ]; then
            echo "::error::MariaDB Prisma schema drift detected (exit code $drift)."
            exit "$drift"
          fi
      - run: npm run db:generate -- mysql
      - run: node tests/migrations/client-parity.mjs mysql
      - run: npx --no-install tsx tests/migrations/mariadb-persistence.ts
      - name: Run migration history again from an empty database
        run: |
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -pci-mariadb-disposable -e 'CREATE DATABASE alaminn_fresh'
          export DATABASE_URL='mysql://root:ci-mariadb-disposable@127.0.0.1:3306/alaminn_fresh'
          npm run db:migrate:deploy -- --config prisma.config.mysql.ts
          npm run db:migrate:status -- --config prisma.config.mysql.ts
          npx --no-install tsx tests/migrations/mariadb-persistence.ts

      - name: Restore a production-format MariaDB backup into restricted scratch space
        env:
          MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -r "$TMP"' EXIT
          trap 'echo "::error::MariaDB recovery fixture failed at shell line $LINENO"' ERR
          SCRATCH_PASS=$(openssl rand -hex 24)
          docker exec -i "$MARIADB_CONTAINER" mariadb -uroot -pci-mariadb-disposable <<SQL
          CREATE DATABASE alaminn_backup_verify_ci;
          CREATE USER 'alaminn_verify'@'%' IDENTIFIED BY '$SCRATCH_PASS';
          GRANT ALL PRIVILEGES ON \`alaminn\_backup\_verify\_ci\`.* TO 'alaminn_verify'@'%';
          SQL
          for command in mariadb mariadb-dump; do
            cat > "$TMP/$command" <<'SH'
          #!/bin/sh
          exec docker exec -i -e MYSQL_PWD "$MARIADB_CONTAINER" "${0##*/}" "$@"
          SH
            chmod 700 "$TMP/$command"
          done
          export PATH="$TMP:$PATH"
          export BACKUP_VERIFY_DATABASE_URL="mysql://alaminn_verify:$SCRATCH_PASS@127.0.0.1:3306/alaminn_backup_verify_ci"
          npm run db:verify -- --approved-read-only
          node scripts/release-backup.mjs "$TMP/verified" --approved
          DATABASE_URL="$BACKUP_VERIFY_DATABASE_URL" npm run db:verify -- --approved-read-only
          test -s "$TMP/verified.sql.gz"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {auditMaria,mariadbOptions} from './scripts/database-catalog.mjs';
          const source = auditMaria(mariadbOptions(process.env.DATABASE_URL));
          const restore = auditMaria(mariadbOptions(process.env.BACKUP_VERIFY_DATABASE_URL));
          assert.deepEqual(restore.counts,source.counts);
          assert.equal(restore.schemaDigest,source.schemaDigest);
          console.log(`MariaDB restored row counts match all ${source.tables.length} fixture tables.`);
          JS
          docker exec "$MARIADB_CONTAINER" mariadb -uroot -pci-mariadb-disposable -Nse \
            "SELECT COUNT(*) FROM alaminn_backup_verify_ci.StaffAccount WHERE id='ci-upgrade-keeper'" | grep -Fx 1

  container:
    name: Container build and runtime readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag alaminn-ci .
      - run: docker build --target migrator --tag alaminn-ci-migrator .
      - name: Start migrated SQLite volume and assert readiness
        run: |
          set -euo pipefail
          docker volume create alaminn-ci-db
          cleanup() {
            if [ -n "$(docker ps -aq --filter name='^/alaminn-ci$')" ]; then docker rm -f alaminn-ci; fi
            docker volume rm alaminn-ci-db
          }
          trap cleanup EXIT
          docker run --rm -v alaminn-ci-db:/app/db -e DATABASE_URL=file:/app/db/ci.sqlite alaminn-ci-migrator
          docker run --name alaminn-ci -d -v alaminn-ci-db:/app/db -p 127.0.0.1:3300:3000 \
            -e DATABASE_URL=file:/app/db/ci.sqlite -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e EMAIL_FROM=ci@example.invalid alaminn-ci
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:3300/api/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs alaminn-ci
          exit 1
