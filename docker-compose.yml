# ═══════════════════════════════════════════════════════════════════
#  Alaminn.info — Docker Compose (production stack)
#  Usage:
#    cp .env.config.example .env.config   # canonical env file
#    # fill required secrets (JWT_SECRET, SESSION_SECRET, CRON_SECRET, ...)
#    docker compose --profile tools run --build --rm migrate
#    docker compose up -d --build
#    docker compose logs -f
#    docker compose down
#
#  Notes:
#  - Canonical env file is .env.config (no $ expansion). Legacy .env is
#    supported by the app runtime but .env.config is preferred.
#  - Do NOT add secret values here. Provide them via env_file or a
#    deployment secret manager.
#  - Avoid ${VAR} interpolation for values that should come from env_file;
#    Compose interpolates ${VAR} from the host/Compose environment, not
#    from env_file, and can override env_file values with empty strings.
# ═══════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alaminn-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.config
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    volumes:
      - app-storage:/app/storage
      - app-db:/app/db
    networks:
      - alaminn-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: migrator
    env_file:
      - path: .env.config
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    volumes:
      - app-db:/app/db

volumes:
  app-storage:
  app-db:

networks:
  alaminn-net:
    driver: bridge
