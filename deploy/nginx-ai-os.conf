# Nginx reverse proxy for the ALAMINN AI-OS stack.
# ------------------------------------------------------------------------
# The ONLY public entry point. Each service is exposed under one path on a
# dedicated server_name (e.g. ai-os.alaminn.info) with:
#   - TLS via the same resolver/certbot flow as the main site
#   - basic-auth/OAuth left to each service (they run with signups off)
#   - generous timeouts for LLM streaming (proxy_read_timeout 300s)
#   - access limited to your team (allow/deny examples below, commented)
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/nginx-ai-os.conf /etc/nginx/sites-available/ai-os
#   sudo ln -s /etc/nginx/sites-available/ai-os /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d ai-os.alaminn.info
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name ai-os.alaminn.info;

  # Certbot renewal path (before redirect to TLS)
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ai-os.alaminn.info;

  ssl_certificate     /etc/letsencrypt/live/ai-os.alaminn.info/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ai-os.alaminn.info/privkey.pem;

  client_max_body_size 64m;

  # Optional hard team-level restriction (uncomment + edit CIDRs):
  # allow 203.0.113.0/24;   # office VPN
  # deny all;

  # ── LiteLLM (OpenAI-compatible API; long timeouts for streaming) ──────
  location /litellm/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ── LibreChat (SSE streaming) ─────────────────────────────────────────
  location /librechat/ {
    proxy_pass http://127.0.0.1:3080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }

  # ── Open-WebUI (websocket) ────────────────────────────────────────────
  location /openwebui/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }

  # ── Activepieces (webhooks + UI) ──────────────────────────────────────
  location /activepieces/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Directus (uploads + API) ──────────────────────────────────────────
  location /directus/ {
    proxy_pass http://127.0.0.1:8055/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── NocoBase ──────────────────────────────────────────────────────────
  location /nocobase/ {
    proxy_pass http://127.0.0.1:8082/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Rocket.Chat (websocket + SSE for real-time chat) ─────────────────
  location /rocketchat/ {
    proxy_pass http://127.0.0.1:3083/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }

  # NOTE: Temporal (7233) and Postgres (5432) intentionally have NO public
  # location — Temporal is used from inside the Docker network / VPN only.
}
