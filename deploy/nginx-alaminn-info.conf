# ─────────────────────────────────────────────────────────────────
# Alaminn.info — Nginx reverse-proxy config (production)
# Target: Ubuntu 22.04 LTS + Nginx + Bun (Next.js 16 standalone)
# Internal app address: 127.0.0.1:3000
# Public URL:           https://alaminn.info
# ─────────────────────────────────────────────────────────────────
# Install:
#   sudo cp deploy/nginx-alaminn-info.conf /etc/nginx/sites-available/alaminn-info
#   sudo ln -sf /etc/nginx/sites-available/alaminn-info /etc/nginx/sites-enabled/alaminn-info
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name alaminn.info www.alaminn.info;

    # ACME challenge passthrough (certbot --webroot style)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Everything else → HTTPS (301 permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (main) ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alaminn.info www.alaminn.info;

    # SSL — Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/alaminn.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alaminn.info/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    # HSTS (also re-emitted by the app, but defence-in-depth at edge)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── www → apex redirect (after SSL is established) ────────────
    if ($host = www.alaminn.info) {
        return 301 https://alaminn.info$request_uri;
    }

    # Max request body — covers document/media uploads (20 MB)
    client_max_body_size 20m;

    # ── Security headers (defence-in-depth; app also emits CSP) ───
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "DENY"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), browsing-topics=(), interest-cohort=()" always;
    # CSP — strict default; allows inline styles (Next.js) + self for scripts.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ── gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/wasm;

    # ── brotli (requires nginx brotli module) ─────────────────────
    # If the brotli module is not installed, these directives are
    # ignored gracefully (no error). Ubuntu 22.04: install via
    #   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ── Next.js static assets — 1-year immutable cache ────────────
    # /_next/static/* is content-hashed so it is safe to cache aggressively.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 1 year, immutable
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Public uploads (served directly by Nginx for speed) ───────
    # location /uploads/ {
    #     alias /var/www/alaminn-info/public/uploads/;
    #     expires 7d;
    #     add_header Cache-Control "public, max-age=604800" always;
    #     access_log off;
    # }

    # ── Main reverse proxy → Next.js standalone (Bun) ─────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # WebSocket support (socket.io, HMR if ever exposed)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Buffering off for streaming / SSE / chunked responses
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts — allow long-running AI/API requests
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── Health check passthrough (no caching, no logging) ─────────
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
