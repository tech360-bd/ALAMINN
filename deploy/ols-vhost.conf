# ─────────────────────────────────────────────────────────────────────
# OpenLiteSpeed reverse-proxy vhost for alaminn.info
# Target server: ALO Education (Ubuntu 22.04 + CyberPanel + OLS)
# ---------------------------------------------------------------------
# PURPOSE: Route all traffic for alaminn.info to the Next.js Node
# process listening on 127.0.0.1:3001. OpenLiteSpeed handles TLS,
# HTTP/3, static asset acceleration, and gzip/brotli; the Node app
# handles SSR, API routes, and dynamic content.
#
# INSTALL (CyberPanel GUI method — recommended):
#   1. CyberPanel → Websites → List Websites → alaminn.info → Manage
#   2. Open "vHost Conf" (or "Configurations" → vHost)
#   3. Append the "REVERSE PROXY" block below to the existing vhost.
#   4. Save → Graceful restart OpenLiteSpeed.
#
# INSTALL (file method — for advanced users):
#   The vhost file lives at:
#     /usr/local/lsws/conf/vhosts/alaminn.info/vhconf.conf
#   Append the block, then: systemctl restart lsws
#
# SSL: Issued by CyberPanel's built-in Let's Encrypt (Websites →
#       SSL → Issue SSL). HTTP/3/QUIC is enabled on port 443 by OLS.
# ─────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════
#  REVERSE PROXY — forward everything to the Node.js standalone server
# ═════════════════════════════════════════════════════════════════════

extprocessor alaminnapp {
  type                     fcgi
  address                  127.0.0.1:3001
  maxConns                 100
  initTimeout              60
  retryTimeout             5
  respBuffer               0
}

# Proxy the application root. The `*` matches every path that is not
# served by a more specific context (static files, etc.).
context / {
  type                     proxy
  handler                  alaminnapp
  addDefaultCharset        off
  maxReqSize               20480K

  # Preserve the original host & client IP so Next.js sees real visitors.
  header                   X-Forwarded-For $REMOTE_ADDR
  header                   X-Forwarded-Proto $HTTPS
  header                   X-Real-IP $REMOTE_ADDR
  header                   Host $HOST

  # Enable WebSocket upgrade for Socket.io / HMR (if needed later).
  enableWebsocket          1
}

# ─────────────────────────────────────────────────────────────────────
#  STATIC ASSET CACHING (served by OLS directly, bypassing Node)
#  Next.js emits immutable hashed assets here — cache aggressively.
# ─────────────────────────────────────────────────────────────────────
context /_next/static/ {
  type                     proxy
  handler                  alaminnapp
  extraHeaders             <<
    Cache-Control: public, max-age=31536000, immutable
    X-Content-Type-Options: nosniff
    X-Frame-Options: SAMEORIGIN
  <<
}

context /brand/ {
  type                     proxy
  handler                  alaminnapp
  extraHeaders             <<
    Cache-Control: public, max-age=86400
  <<
}

# ─────────────────────────────────────────────────────────────────────
#  SECURITY HEADERS (applied at the OLS edge so they cover everything)
# ─────────────────────────────────────────────────────────────────────
# Add these to the vhost's "Header Operations" or the vhconf under
# the docroot context:
#
#   Strict-Transport-Security: max-age=63072000; includeSubDomains; preload
#   X-Content-Type-Options: nosniff
#   X-Frame-Options: SAMEORIGIN
#   Referrer-Policy: strict-origin-when-cross-origin
#   Permissions-Policy: camera=(), microphone=(), geolocation=()
#   Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'
#
# NOTE: The CSP is also emitted by the Next.js middleware (src/proxy.ts)
# as defence-in-depth. OLS adding it at the edge means static files
# served outside Node also get the headers.
